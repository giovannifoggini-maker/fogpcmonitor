name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate source syntax
        run: python -m py_compile FogMonitor.py

      - name: Run helper tests
        run: python -m unittest discover -s tests -v

      - name: Install packaging tool
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Build standalone EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name FogMonitor
          --icon assets/fogmonitor.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          FogMonitor.py

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item README-PORTABLE.txt dist/README-FogMonitor.txt
          Compress-Archive -Path dist/FogMonitor.exe,dist/README-FogMonitor.txt,LICENSE.txt -DestinationPath release/FogMonitor-by-FogLabs-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FogMonitor-by-FogLabs-Windows
          path: release/FogMonitor-by-FogLabs-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach ZIP to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/FogMonitor-by-FogLabs-Windows.zip
          generate_release_notes: true
